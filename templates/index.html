{% extends "app_layout.html" %}
{% block title %}AI Chat Assistant{% endblock %}

{% block app_content %}
<style>
    /* ═══════════════════════════════════════════════════════════════
   AI CHAT PAGE - Optimized Layout
═══════════════════════════════════════════════════════════════ */

    .chat-page {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 0.75rem;
        height: calc(100vh - 64px - 3.5rem);
    }

    /* ═══════════════════════════════════════════════════════════════
   MAIN CHAT AREA
═══════════════════════════════════════════════════════════════ */
    .chat-main {
        display: flex;
        flex-direction: column;
        background: white;
        border-radius: 14px;
        border: 1px solid #e5e7eb;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .chat-header {
        padding: 0.85rem 1.25rem;
        background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
        border-bottom: 1px solid #d1fae5;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        flex-shrink: 0;
    }

    .chat-header-avatar {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .chat-header-avatar svg {
        width: 20px;
        height: 20px;
    }

    .chat-header-info h2 {
        font-size: 0.95rem;
        font-weight: 600;
        color: #1f2937;
        margin: 0;
    }

    .chat-header-info p {
        font-size: 0.75rem;
        color: #059669;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.3rem;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        background: #10b981;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {

        0%,
        100% {
            opacity: 1;
        }

        50% {
            opacity: 0.5;
        }
    }

    .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        background: #fafbfc;
    }

    .chat-box::-webkit-scrollbar {
        width: 5px;
    }

    .chat-box::-webkit-scrollbar-track {
        background: transparent;
    }

    .chat-box::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 5px;
    }

    /* Messages */
    .user-message-container {
        display: flex;
        justify-content: flex-end;
        animation: msgIn 0.25s ease;
    }

    @keyframes msgIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .user-message-content {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        padding: 0.75rem 1.1rem;
        border-radius: 16px 16px 4px 16px;
        max-width: 70%;
        font-size: 0.9rem;
        line-height: 1.5;
    }

    /* Bot Response - Professional Embedded Style */
    .bot-response-container {
        display: flex;
        gap: 1rem;
        padding: 0.5rem 1rem 0.5rem 0.5rem;
        /* Right padding for readability */
        width: 100%;
        animation: msgIn 0.25s ease;
    }

    .bot-avatar {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #1e293b, #334155);
        border-radius: 6px;
        /* Slightly squarer */
        display: flex;
        align-items: center;
        justify-content: center;
        color: #10b981;
        font-weight: 700;
        font-size: 0.75rem;
        flex-shrink: 0;
        margin-top: 4px;
        /* Align with first line of text */
    }

    .bot-response-content {
        background: transparent;
        border: none;
        padding: 0;
        max-width: 100%;
        flex: 1;

        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 1rem;
        /* Readable professional size */
        line-height: 1.7;
        /* Comfortable reading */
        color: #1f2937;
    }

    /* Markdown Element Styling */
    .bot-response-content p {
        margin-bottom: 1rem;
    }

    .bot-response-content p:last-child {
        margin-bottom: 0;
    }

    .bot-response-content h1,
    .bot-response-content h2,
    .bot-response-content h3,
    .bot-response-content h4 {
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        font-weight: 600;
        color: #111827;
        line-height: 1.3;
    }

    .bot-response-content strong {
        font-weight: 600;
        color: #0f172a;
    }

    .bot-response-content ul,
    .bot-response-content ol {
        margin: 0.75rem 0;
        padding-left: 1.5rem;
    }

    .bot-response-content li {
        margin-bottom: 0.35rem;
    }

    /* Code Blocks */
    .bot-response-content pre {
        background: #1e293b;
        color: #f8fafc;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        margin: 1rem 0;
        position: relative;
        font-size: 0.9em;
        line-height: 1.5;
        border: 1px solid #334155;
    }

    .bot-response-content code {
        font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
    }

    /* Inline Code */
    .bot-response-content p code,
    li code {
        background: rgba(16, 185, 129, 0.1);
        color: #059669;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        font-size: 0.9em;
        font-weight: 500;
    }

    .copy-code-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 0.3rem 0.6rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        color: #94a3b8;
        font-size: 0.75rem;
        cursor: pointer;
        opacity: 0;
        transition: all 0.2s;
    }

    .copy-code-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        color: white;
    }

    .bot-response-content pre:hover .copy-code-btn {
        opacity: 1;
    }

    .bot-response-timestamp {
        display: none;
        /* Hide timestamp for cleaner look or move it */
    }

    /* Typing */
    .typing-indicator-container {
        display: flex;
        align-items: center;
        gap: 0.65rem;
    }

    .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 0.75rem 1rem;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
    }

    .typing-indicator span {
        width: 7px;
        height: 7px;
        background: #10b981;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) {
        animation-delay: -0.32s;
    }

    .typing-indicator span:nth-child(2) {
        animation-delay: -0.16s;
    }

    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0.6);
            opacity: 0.5;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    /* Greeting */
    .chat-greeting {
        text-align: center;
        padding: 1.5rem 1rem;
    }

    .chat-greeting-icon {
        width: 54px;
        height: 54px;
        background: linear-gradient(135deg, #ecfdf5, #d1fae5);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 0.85rem;
    }

    .chat-greeting-icon svg {
        width: 26px;
        height: 26px;
        color: #10b981;
    }

    .chat-greeting h3 {
        font-size: 1.1rem;
        font-weight: 600;
        color: #1f2937;
        margin: 0 0 0.35rem;
    }

    .chat-greeting p {
        font-size: 0.85rem;
        color: #6b7280;
        margin: 0;
    }

    .chat-suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: center;
        margin-top: 0.85rem;
    }

    .chat-suggestion-btn {
        padding: 0.4rem 0.75rem;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        font-size: 0.78rem;
        color: #374151;
        cursor: pointer;
        transition: all 0.15s;
    }

    .chat-suggestion-btn:hover {
        background: #f0fdf4;
        border-color: #10b981;
        color: #059669;
    }

    /* Input */
    .chat-input-area {
        padding: 0.85rem 1.25rem;
        background: white;
        border-top: 1px solid #e5e7eb;
        flex-shrink: 0;
    }

    .chat-form {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        background: #f9fafb;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        padding: 0.4rem 0.4rem 0.4rem 1rem;
        transition: all 0.2s;
    }

    .chat-form:focus-within {
        border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        background: white;
    }

    #chat-input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 0.9rem;
        color: #1f2937;
        font-family: inherit;
    }

    #chat-input::placeholder {
        color: #9ca3af;
    }

    .chat-btn {
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        flex-shrink: 0;
    }

    .chat-btn svg {
        width: 18px;
        height: 18px;
    }

    .chat-btn.send-btn {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
    }

    .chat-btn.send-btn:hover {
        transform: scale(1.05);
    }

    .chat-btn.record-btn {
        background: #f3f4f6;
        color: #6b7280;
    }

    .chat-btn.record-btn:hover {
        background: #e5e7eb;
        color: #374151;
    }

    .chat-btn.record-btn.recording {
        background: #fef2f2;
        color: #ef4444;
        animation: recPulse 1s infinite;
    }

    @keyframes recPulse {

        0%,
        100% {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
        }

        50% {
            box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
        }
    }

    /* ═══════════════════════════════════════════════════════════════
   RIGHT PANEL - Avatar TOP, Quick Actions BOTTOM
═══════════════════════════════════════════════════════════════ */
    .right-panel {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }

    /* Avatar Card - First */
    .avatar-card {
        order: 1;
        background: #1a1f2e;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .avatar-card-header {
        padding: 0.6rem 0.85rem;
        background: rgba(16, 185, 129, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
    }

    .avatar-card-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: white;
        display: flex;
        align-items: center;
        gap: 0.35rem;
    }

    .avatar-card-title svg {
        width: 14px;
        height: 14px;
        color: #10b981;
    }

    .avatar-status {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.65rem;
        color: #10b981;
    }

    .avatar-status-dot {
        width: 5px;
        height: 5px;
        background: #10b981;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    #avatar-canvas {
        flex: 1;
        width: 100%;
        min-height: 280px;
        background: #111827;
        position: relative;
    }

    /* ═══════════════════════════════════════════════════════════════
       AVATAR THINKING STATE
    ═══════════════════════════════════════════════════════════════ */
    .avatar-card.thinking {
        animation: thinkingGlow 2s ease-in-out infinite;
    }

    @keyframes thinkingGlow {

        0%,
        100% {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), 0 0 0 0 rgba(16, 185, 129, 0);
        }

        50% {
            box-shadow: 0 4px 30px rgba(16, 185, 129, 0.3), 0 0 20px rgba(16, 185, 129, 0.2);
        }
    }

    .avatar-card.thinking .avatar-card-header {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
    }

    .avatar-card.thinking .avatar-status {
        color: #fbbf24;
    }

    .avatar-card.thinking .avatar-status-dot {
        background: #fbbf24;
        animation: thinkingDot 0.6s ease-in-out infinite;
    }

    @keyframes thinkingDot {

        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.4);
        }
    }

    /* Thinking overlay on canvas */
    .avatar-thinking-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0.75rem 1rem;
        background: linear-gradient(to top, rgba(17, 24, 39, 0.95), transparent);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .avatar-card.thinking .avatar-thinking-overlay {
        opacity: 1;
    }

    .thinking-text {
        color: #10b981;
        font-size: 0.8rem;
        font-weight: 500;
    }

    .thinking-dots {
        display: flex;
        gap: 3px;
    }

    .thinking-dots span {
        width: 6px;
        height: 6px;
        background: #10b981;
        border-radius: 50%;
        animation: thinkingBounce 1.2s ease-in-out infinite;
    }

    .thinking-dots span:nth-child(1) {
        animation-delay: 0s;
    }

    .thinking-dots span:nth-child(2) {
        animation-delay: 0.15s;
    }

    .thinking-dots span:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes thinkingBounce {

        0%,
        60%,
        100% {
            transform: translateY(0);
        }

        30% {
            transform: translateY(-6px);
        }
    }

    /* Quick Actions - Second (Below Avatar) */
    .quick-actions-card {
        order: 2;
        background: white;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        overflow: hidden;
        flex-shrink: 0;
    }

    .quick-actions-header {
        padding: 0.65rem 0.85rem;
        border-bottom: 1px solid #f3f4f6;
        font-size: 0.78rem;
        font-weight: 600;
        color: #374151;
    }

    .quick-actions-list {
        padding: 0.4rem;
    }

    .quick-action-btn {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.55rem 0.7rem;
        background: transparent;
        border: none;
        border-radius: 8px;
        font-size: 0.78rem;
        color: #6b7280;
        cursor: pointer;
        transition: all 0.15s;
        text-align: left;
    }

    .quick-action-btn:hover {
        background: #f9fafb;
        color: #10b981;
    }

    .quick-action-btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }

    /* ═══════════════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════════════ */
    @media (max-width: 1000px) {
        .chat-page {
            grid-template-columns: 1fr 260px;
        }

        #avatar-canvas {
            min-height: 240px;
        }
    }

    @media (max-width: 800px) {
        .chat-page {
            grid-template-columns: 1fr;
            grid-template-rows: 200px 1fr;
            gap: 0.6rem;
        }

        .right-panel {
            order: -1;
            flex-direction: row;
            height: 100%;
        }

        .avatar-card {
            flex: 2;
        }

        #avatar-canvas {
            min-height: 160px;
        }

        .quick-actions-card {
            flex: 1;
        }

        .chat-main {
            min-height: 350px;
        }
    }

    @media (max-width: 550px) {
        .right-panel {
            flex-direction: column;
            gap: 0.5rem;
        }

        .avatar-card {
            height: 180px;
        }

        #avatar-canvas {
            min-height: 140px;
        }

        .quick-actions-card {
            display: none;
        }

        .chat-box {
            padding: 1rem;
        }

        .user-message-content,
        .bot-response-content {
            max-width: 85%;
        }
    }
</style>

<div class="chat-page">

    <!-- Chat Area -->
    <div class="chat-main">
        <div class="chat-header">
            <div class="chat-header-avatar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </div>
            <div class="chat-header-info">
                <h2>AI Assistant</h2>
                <p><span class="status-dot"></span> Online & Ready</p>
            </div>
        </div>

        <div id="chat-box" class="chat-box">
            <div id="greeting-message" class="chat-greeting">
                <div class="chat-greeting-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" />
                        <path d="M2 17l10 5 10-5" />
                        <path d="M2 12l10 5 10-5" />
                    </svg>
                </div>
                <h3>Hello! How can I help you?</h3>
                <p>Ask me anything about your documents.</p>
                <div class="chat-suggestions">
                    <button class="chat-suggestion-btn" onclick="askQuestion('What topics are covered?')">📚
                        Topics</button>
                    <button class="chat-suggestion-btn" onclick="askQuestion('Summarize my files')">📝
                        Summarize</button>
                    <button class="chat-suggestion-btn" onclick="askQuestion('Explain a concept')">💡 Explain</button>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <form id="chat-form" class="chat-form">
                <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" />
                <button id="recordButton" type="button" class="chat-btn record-btn" title="Voice">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg>
                </button>
                <button type="submit" class="chat-btn send-btn" title="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Right: Avatar (TOP) + Quick Actions (BOTTOM) -->
    <div class="right-panel">

        <!-- Avatar - TOP -->
        <div class="avatar-card" id="avatar-card">
            <div class="avatar-card-header">
                <span class="avatar-card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M8 14s1.5 2 4 2 4-2 4-2" />
                        <line x1="9" y1="9" x2="9.01" y2="9" />
                        <line x1="15" y1="9" x2="15.01" y2="9" />
                    </svg>
                    AI Avatar
                </span>
                <span class="avatar-status"><span class="avatar-status-dot"></span> Active</span>
            </div>
            <div id="avatar-canvas">
                <div class="avatar-thinking-overlay">
                    <span class="thinking-text">Thinking</span>
                    <div class="thinking-dots"><span></span><span></span><span></span></div>
                </div>
            </div>
        </div>

        <!-- Quick Actions - BOTTOM -->
        <div class="quick-actions-card">
            <div class="quick-actions-header">Quick Actions</div>
            <div class="quick-actions-list">
                <button class="quick-action-btn" onclick="askQuestion('Summarize my files')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                    </svg>
                    Summarize Files
                </button>
                <button class="quick-action-btn" onclick="askQuestion('Generate quiz questions')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    </svg>
                    Generate Quiz
                </button>
                <button class="quick-action-btn" onclick="askQuestion('List key points')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="6" x2="21" y2="6" />
                        <line x1="8" y1="12" x2="21" y2="12" />
                        <line x1="8" y1="18" x2="21" y2="18" />
                    </svg>
                    Key Points
                </button>
                <button class="quick-action-btn" onclick="clearChat()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                    Clear Chat
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function askQuestion(q) {
        const input = document.getElementById('chat-input');
        if (input) {
            input.value = q;
            document.getElementById('chat-form').dispatchEvent(new Event('submit'));
        }
    }

    function clearChat() {
        const chatBox = document.getElementById('chat-box');
        if (chatBox) {
            chatBox.innerHTML = '<div class="chat-greeting"><div class="chat-greeting-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div><h3>Chat cleared!</h3><p>Start fresh.</p></div>';
        }
    }

    const recordBtn = document.getElementById('recordButton');
    if (recordBtn) {
        recordBtn.addEventListener('click', function () { this.classList.toggle('recording'); });
    }
</script>
{% endblock %}
